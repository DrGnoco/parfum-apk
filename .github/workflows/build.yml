name: Compiler APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du fichier index.html
        uses: actions/checkout@v4

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Génération du projet Android natif
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/ch/indexolfactif/app
          mkdir -p app/src/main/res/xml

          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          rootProject.name = "IndexOlfactif"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ch.indexolfactif.app'
              compileSdk 34
              defaultConfig {
                  applicationId "ch.indexolfactif.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="camera_images" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Index Olfactif CHF"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="ch.indexolfactif.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ch/indexolfactif/app/MainActivity.java
          package ch.indexolfactif.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import java.io.File;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> fileUploadCallback;
              private Uri cameraImageUri;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private static final int CAMERA_PERMISSION_CODE = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#141211"));
                  getWindow().setNavigationBarColor(Color.parseColor("#141211"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  webView.setBackgroundColor(Color.parseColor("#141211"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (fileUploadCallback != null) {
                              fileUploadCallback.onReceiveValue(null);
                          }
                          fileUploadCallback = filePathCallback;

                          if (fileChooserParams.isCaptureEnabled()) {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_CODE);
                              } else {
                                  openCamera();
                              }
                          } else {
                              openGallery();
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void openCamera() {
                  try {
                      File photoFile = new File(getCacheDir(), "parfum_" + System.currentTimeMillis() + ".jpg");
                      cameraImageUri = FileProvider.getUriForFile(this, "ch.indexolfactif.app.fileprovider", photoFile);
                      Intent captureIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      captureIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraImageUri);
                      captureIntent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      startActivityForResult(captureIntent, FILE_CHOOSER_RESULT_CODE);
                  } catch (Exception e) {
                      if (fileUploadCallback != null) {
                          fileUploadCallback.onReceiveValue(null);
                          fileUploadCallback = null;
                      }
                  }
              }

              private void openGallery() {
                  Intent contentSelectionIntent = new Intent(Intent.ACTION_GET_CONTENT);
                  contentSelectionIntent.addCategory(Intent.CATEGORY_OPENABLE);
                  contentSelectionIntent.setType("image/*");
                  startActivityForResult(Intent.createChooser(contentSelectionIntent, "Choisir une photo"), FILE_CHOOSER_RESULT_CODE);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_PERMISSION_CODE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          openCamera();
                      } else if (fileUploadCallback != null) {
                          fileUploadCallback.onReceiveValue(null);
                          fileUploadCallback = null;
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (fileUploadCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK) {
                          if (data != null && data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          } else if (cameraImageUri != null) {
                              results = new Uri[]{cameraImageUri};
                          }
                      }
                      fileUploadCallback.onReceiveValue(results);
                      fileUploadCallback = null;
                      cameraImageUri = null;
                  }
              }
          }
          EOF

      - name: Compilation du fichier APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Index-Olfactif-CHF.apk

      - name: Publication directe du fichier APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Application Android v1.0.${{ github.run_number }}"
          files: Index-Olfactif-CHF.apk
